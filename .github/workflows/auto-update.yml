name: Auto-Generate QBR Reports

on:
  push:
    paths:
      - '*.xlsx'
  workflow_dispatch:

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install openpyxl matplotlib pandas
      
      - name: Generate reports
        run: python generate-report.py
      
      - name: Check if files were created
        run: |
          ls -la reports/ 2>/dev/null || echo "Reports folder not found"
          ls -la data/ 2>/dev/null || echo "Data folder not found"
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-generate reports" || echo "No changes to commit"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
