name: Auto-Generate QBR Reports

# Trigger automatically on a schedule
on:
  # Runs on the 1st of every month at 8 AM UTC
  schedule:
    - cron: '0 8 1 * *'
  
  # Also allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  
  # Trigger when Excel files are pushed
  push:
    paths:
      - '*.xlsx'

jobs:
  generate-reports:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Check out repository code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      # Step 3: Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl matplotlib pandas
      
      # Step 4: Download latest Excel files (optional - from shared location)
      # Uncomment if you want to auto-download from OneDrive, Google Drive, etc.
      # - name: Download Excel files
      #   run: |
      #     # Example: Download from OneDrive shared link
      #     wget -O SOI_Tracking_Sheet_2026__2_.xlsx "YOUR_DOWNLOAD_LINK"
      
      # Step 5: Run report generator
      - name: Generate reports and graphs
        run: |
          python generate-report.py
      
      # Step 6: Commit and push changes
      - name: Commit generated
